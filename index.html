<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Webinar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Presensi Webinar</h1>
        <p>Formulir kehadiran peserta dengan tanda tangan digital</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Formulir Presensi</h2>

            <form id="presensiForm">
                <label for="namaWebinar">Nama Webinar</label>
                <input
                    type="text"
                    id="namaWebinar"
                    placeholder="Contoh: Seminar Teknologi Digital"
                    required
                >

                <label for="tanggal">Tanggal Webinar</label>
                <input type="date" id="tanggal" required>

                <label for="nama">Nama Lengkap Peserta</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <label for="sekolah">Asal Sekolah / Instansi</label>
                <input
                    type="text"
                    id="sekolah"
                    placeholder="Masukkan asal sekolah"
                    required
                >

                <label>Tanda Tangan Peserta</label>
                <div class="signature-box">
                    <canvas id="signatureCanvas"></canvas>
                </div>

                <p class="hint">
                    Bubuhkan tanda tangan menggunakan mouse
                    atau layar sentuh.
                </p>

                <div class="button-group">
                    <button type="button" id="hapusTTD" class="btn-reset">
                        Hapus TTD
                    </button>

                    <button type="submit" class="btn-save">
                        Simpan Presensi
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Daftar Kehadiran</h2>

            <input
                type="search"
                id="pencarian"
                placeholder="Cari nama peserta..."
                aria-label="Cari nama peserta"
            >

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Nama Peserta</th>
                            <th>Asal Sekolah</th>
                            <th>Tanggal</th>
                            <th>Tanda Tangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="daftarPresensi"></tbody>
                </table>
            </div>

            <p id="jumlahPeserta">Total peserta: 0</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Presensi Webinar</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
